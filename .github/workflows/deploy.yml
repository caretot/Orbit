# Builds library.js from your folders and publishes the site to GitHub Pages
# on every upload. Nothing to edit here.
name: Build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history -> real "date added" for each song
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build library.js
        run: |
          pip install mutagen
          python build_library.py
      - name: Prepare site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_src' --exclude 'deploy-workflow.yml' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
